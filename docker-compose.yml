# One service per customer. The bot is personalised - one bot, one person, one wallet - so
# scaling means more instances, not a bigger one. Each is ~78 MB, so a 4 GB box runs 40-odd.
#
# To add a customer:
#   1. @BotFather -> /newbot -> name it after them, e.g. tipping_bot_for_dana
#   2. put the token in .env as DANA_BOT_TOKEN=...
#   3. write customers/dana.yaml (copy tipbot.yaml.example)
#   4. copy the block below, replace every "mdefman" with "dana"
#   5. docker compose up -d
#
# Nothing here is shared between customers: separate token, separate wallet file, separate
# volume. One customer's bot cannot see another's invoices, and removing one removes nothing else.

services:
  mdefman:
    # Built by CI and pulled here, so the droplet never needs a JDK, Gradle, or the swap file
    # that compiling Kotlin on 1 GB otherwise demands. The tag is pinned in .env by the deploy
    # workflow, which is what makes a rollback "set it to an older sha and up -d".
    # `build: .` stays so that a laptop can still `docker compose build` without a registry.
    image: ghcr.io/ktelfon/mega-tipper:${TIPBOT_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${MDEFMAN_BOT_TOKEN:?set MDEFMAN_BOT_TOKEN in .env}
      # Optional: raises the TonAPI rate limit, shared across all bots on this host.
      TONAPI_KEY: ${TONAPI_KEY:-}
      # Sized for the work rather than for the host. The JVM reads the container limit below,
      # so without one it would size a heap for the whole machine - which is how this was first
      # measured at 156 MB on a 15 GB laptop instead of the 78 MB it actually needs.
      JAVA_OPTS: >-
        -Xmx48m -Xss512k -XX:MaxMetaspaceSize=64m
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    # Verified to start and run at 128m; 192m leaves headroom for a burst of tippers at once.
    mem_limit: 192m
    volumes:
      - mdefman-data:/data
      - ./customers/mdefman.yaml:/config/tipbot.yaml:ro
    logging:
      # Without a cap these grow forever on a small VPS.
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The marketing site. Everything it needs lives under web/ and nothing under web/ is part
  # of the bot - no shared volume, no shared image, no shared build. Stopping this service
  # cannot affect a tip, because the bots talk to Telegram outbound and never through here.
  # This is the only service on the host that listens on a port.
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Not used while the site is reached by IP, but published now so that swapping the
      # Caddyfile to a real domain needs a restart rather than an edit here.
      - "443:443"
    volumes:
      - ./web/site:/srv:ro
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      # Where the certificate lands once there is a domain. Without a volume Caddy would
      # request a new one on every restart and hit Let's Encrypt's rate limit.
      - caddy-data:/data
    # Serving static files from a tmpfs-sized cache; measured well under this.
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # A named volume, not a bind mount: the container runs as an unprivileged user, and Docker
  # sets ownership on a named volume so the bot can actually write its database.
  mdefman-data:
  caddy-data:
